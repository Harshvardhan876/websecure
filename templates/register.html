{% extends "base.html" %}

{% block title %}WebSecure - Register{% endblock %}

{% block content %}
<section class="scan-panel">
    <h1>Create an account</h1>

    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}

    <form class="auth-form" action="/register" method="POST">
        <label for="name" class="scan-label">Name</label>
        <input type="text" id="name" name="name" class="scan-input" required>

        <label for="email" class="scan-label">Email</label>
        <input type="email" id="email" name="email" class="scan-input" required>

        <label for="password" class="scan-label">Password</label>
        <input type="password" id="password" name="password" class="scan-input" minlength="8" required>

        <button type="submit" class="scan-button">Register</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
</section>
{% endblock %}
