<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebSecure{% endblock %}</title>
    {% block head_extra %}{% endblock %}
    <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block header %}
    <header class="site-header">
        <div class="container header-row">
            <span class="brand">WebSecure</span>
        </div>
    </header>
    {% endblock %}

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="toast-stack" role="status" aria-live="polite">
        {% for message in messages %}
        <div class="toast"><span>{{ message }}</span><button type="button" aria-label="Dismiss">&times;</button></div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <a href="/terms">Terms of Service</a>
            <a href="/privacy">Privacy Policy</a>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
