{% extends "base.html" %}

{% block title %}WebSecure - Log In{% endblock %}

{% block content %}
<section class="scan-panel">
    <h1>Log in</h1>

    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}

    <form class="auth-form" action="/login" method="POST">
        <label for="email" class="scan-label">Email</label>
        <input type="email" id="email" name="email" class="scan-input" required>

        <label for="password" class="scan-label">Password</label>
        <input type="password" id="password" name="password" class="scan-input" required>

        <button type="submit" class="scan-button">Log In</button>
    </form>

    <p class="auth-switch">No account? <a href="/register">Register</a></p>
</section>
{% endblock %}
