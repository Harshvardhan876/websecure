{# The WebSecure mark: hexagon frame, shield-shaped node network and keyhole. Same drawing as static/logo.svg;
   colours come from CSS (--ws-logo-frame and --ws-accent) so it follows the theme. #}
{% macro logo(height=30) -%}
<svg class="ws-logo" viewBox="-1.5 -1.5 53 66" width="{{ (height * 53 / 66) | round(1) }}" height="{{ height }}" aria-hidden="true" focusable="false">
    <g class="ws-logo-frame" fill="none" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M24.9 0 50 10.8v32L24.9 62.8 0 42.8v-32Z"/>
        <path d="M24.9 0v9.6M24.9 51.6v11.2M0 10.8l8.8 5.2M50 10.8l-9.2 5.2M0 42.8l8.8-6M50 42.8l-9.2-6"/>
    </g>
    <g class="ws-logo-net" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M24.9 9.6 8.8 16v20.8Q12 42 24.9 51.6Q37.8 42 40.8 36.8V16Z"/>
        <path d="M24.9 9.6v10.4M8.8 16l11 6.5M40.8 16l-11 6.5M8.8 36.8l11-7.6M40.8 36.8l-11-7.6M24.9 40v11.6"/>
        <path d="M22.4 29.5a4.6 4.6 0 1 1 5 0L30.4 40H19.4Z"/>
    </g>
    <g class="ws-logo-nodes">
        <circle cx="24.9" cy="9.6" r="3.1"/><circle cx="8.8" cy="16" r="3.1"/><circle cx="40.8" cy="16" r="3.1"/>
        <circle cx="8.8" cy="36.8" r="3.1"/><circle cx="40.8" cy="36.8" r="3.1"/><circle cx="24.9" cy="51.6" r="3.1"/>
    </g>
</svg>
{%- endmacro %}

{% macro wordmark() -%}
<span class="ws-wordmark">Web<span>Secure</span></span>
{%- endmacro %}
